name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests ../mock
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build

  image:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t switchyard:ci .
      - name: Smoke test both container roles
        run: |
          docker run -d --name app -p 8000:8000 switchyard:ci
          docker run -d --name mock -p 9100:9100 -e SWITCHYARD_ROLE=mock switchyard:ci
          for i in $(seq 1 30); do curl -fsS localhost:8000/readyz && curl -fsS localhost:9100/healthz && exit 0; sleep 2; done
          docker logs app; docker logs mock; exit 1
